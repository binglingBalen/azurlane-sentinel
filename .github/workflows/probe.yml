name: azurlane-version-sentinel

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      verify_delivery:
        description: 'Issue one read-only delivery/acknowledgement check task'
        type: boolean
        default: false
      duration_seconds:
        description: 'Monitor lifetime before automatic handoff (120..18000 seconds)'
        type: number
        default: 18000

permissions:
  contents: write
  actions: write

concurrency:
  group: azurlane-sentinel
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Continuous content detection and machine task delivery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERIFY_DELIVERY: ${{ inputs.verify_delivery }}
          WATCH_DURATION: ${{ inputs.duration_seconds || '18000' }}
        run: |
          if [ "$VERIFY_DELIVERY" = "true" ]; then
            python -u watch.py --interval 60 --duration "$WATCH_DURATION" --verify-delivery
          else
            python -u watch.py --interval 60 --duration "$WATCH_DURATION"
          fi
